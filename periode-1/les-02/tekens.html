<!DOCTYPE html>
<html lang="nl">
<head>
    
    <title>HTML-tekens</title>
</head>
<body>

    <header>
        <h1>HTML-tekens</h1>
    </header>

    <section>
        <p>
            Een getal is <strong>&lt;</strong> kleiner dan een ander getal.<br>
            Een getal is <strong>&gt;</strong> groter dan een ander getal.<br>
            Met <strong>&amp;</strong> verbind je bijvoorbeeld twee woorden.<br>
            Het teken <strong>&copy;</strong> wordt gebruikt voor copyright.<br>
            Het teken <strong>&euro;</strong> staat voor de euro.
        </p>
    </section>

</body>
</html>
