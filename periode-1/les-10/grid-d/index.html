<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
 
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .container {
            display: grid;
            grid-template-columns: 140px 1fr;
            grid-template-rows: 75px 228px 75px;
        }

        .item {
            border: 1px solid black;
            padding: 10px;
            font-size: 22px;
        }

        .header {
            grid-column: 1 / 3;
        }

        .aside {
            grid-column: 1;
            grid-row: 2;
        }

        .main {
            grid-column: 2;
            grid-row: 2;
        }

        .footer {
            grid-column: 1 / 3;
        }
    </style>
</head>
<body>

    <p>Layout D.</p>

    <div class="container">
        <div class="item header">Header</div>
        <div class="item aside">Aside</div>
        <div class="item main">Main</div>
        <div class="item footer">Footer</div>
    </div>

</body>
</html>
