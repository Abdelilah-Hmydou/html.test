<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Box Model Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Box Model Demo</h1>
  <div class="main-flex-row">
    <div class="css-input">
      <textarea id="css-input" rows="4" cols="60">
height: 250px;
margin: 10px;
padding: 5px;
border: 10px solid black;
      </textarea>
    </div>
    <div class="output output-flex-col">
      <div class="box-model">
        <div id="box-preview" class="margin-box">
          <div class="border-box">
            <div class="padding-box">
              <div class="content-box">
                <img class="transparant-cat" src="img/content.png" alt="Cat" />
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="preview">
        <img class="cat-img" src="img/cat.jpg" alt="Cat" />
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
