<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WYSIWYG Html editor</title>
    <link rel="stylesheet" href="styles/style.css">
    <script src="scripts/script.js"></script>
</head>
<body>
    <h1>WYSIWYG Html editor</h1>

    <div class="main">
        <div class="left">
            <div class="toolbar">
                <button>Preview</button>
                <button>Load default</button>
            </div>
            <div class="html_container">
                <h2>HTML</h2>
                <textarea name="html_code" id="" cols="30" rows="10" spellcheck="false">

                </textarea>
            </div>
            <div class="css_container">
                <h2>CSS</h2>
                <textarea name="css_code" id="" cols="30" rows="10" spellcheck="false">

                </textarea>
            </div>
            <div class="javascript_container">
                <h2>JavaScript</h2>
                <textarea name="javascript_code" id="" cols="30" rows="10" spellcheck="false">

                </textarea>
            </div>
        </div>
        <div class="right">

        </div>
    </div>
</body>
</html>
